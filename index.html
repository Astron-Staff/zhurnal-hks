/* Layout: mobile tool shell — sticky top bar, scrolling work area, fixed bottom tabs (top tabs on wide screens); documents shown as white paper sheets. */
:root {
  --cal-off: #D7E5F8; --cal-off-ink: #1C4A86; --cal-hol: #E2561B; --cal-hol-ink: #FFFFFF; --cal-short: #F2E3B6; --cal-short-ink: #5E470A;
  --bg: #EDF0F2;
  --surface: #FFFFFF;
  --surface-2: #F5F7F8;
  --ink: #15202A;
  --muted: #5A6774;
  --line: #D3DAE0;
  --line-strong: #A3AEB8;
  --accent: #E3A511;
  --accent-ink: #1D1503;
  --accent-text: #7A5100;
  --accent-soft: #FBF0D2;
  --red: #E0271C;
  --red-ink: #FFFFFF;
  --red-soft: #FDE4E1;
  --ok: #22714A;
  --warn: #A86200;
  --scrim: rgb(10 16 22 / 0.45);
  --paper: #FFFFFF;
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-ui: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 12px;
  --shadow: 0 1px 2px rgb(20 30 40 / 0.06), 0 6px 18px rgb(20 30 40 / 0.07);
  --bar-h: 56px;
  --nav-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --cal-off: #1F3452; --cal-off-ink: #B3CFF5; --cal-hol: #D2501C; --cal-hol-ink: #FFFFFF; --cal-short: #4A3C12; --cal-short-ink: #F2D88E;
  --bg: #0E1318; --surface: #161D24; --surface-2: #1C252E; --ink: #E5EAEE; --muted: #94A2AF;
    --line: #29343E; --line-strong: #45525E; --accent: #F0B323; --accent-ink: #1D1503; --accent-text: #F3BE45;
    --accent-soft: #3A2E10; --red: #F0443A; --red-ink: #FFFFFF; --red-soft: #4A1F1C; --ok: #5CC08A; --warn: #F2A33A;
    --scrim: rgb(0 0 0 / 0.6); --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 6px 18px rgb(0 0 0 / 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --cal-off: #1F3452; --cal-off-ink: #B3CFF5; --cal-hol: #D2501C; --cal-hol-ink: #FFFFFF; --cal-short: #4A3C12; --cal-short-ink: #F2D88E;
  --bg: #0E1318; --surface: #161D24; --surface-2: #1C252E; --ink: #E5EAEE; --muted: #94A2AF;
  --line: #29343E; --line-strong: #45525E; --accent: #F0B323; --accent-ink: #1D1503; --accent-text: #F3BE45;
  --accent-soft: #3A2E10; --red: #F0443A; --red-ink: #FFFFFF; --red-soft: #4A1F1C; --ok: #5CC08A; --warn: #F2A33A;
  --scrim: rgb(0 0 0 / 0.6); --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 6px 18px rgb(0 0 0 / 0.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
/* зум страницы выключен: только прокрутка; в просмотрщике масштаб делает сам код */
html, body { touch-action: pan-x pan-y; }
/* iPhone увеличивает страницу при вводе в поле с текстом мельче 16px */
html.ios input, html.ios select, html.ios textarea, html.ios .cell-select, html.ios .lt textarea { font-size: 16px; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 var(--f-ui);
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: -4px 0 auto; height: calc(env(safe-area-inset-top, 0px) + 4px);
  z-index: 40; background: var(--surface);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* ---------- top bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.bar-in { height: var(--bar-h); display: flex; align-items: center; gap: 4px; max-width: 1240px; margin: 0 auto; }
.bar h1 {
  flex: 1; min-width: 0; margin: 0 6px; font: 600 15px/1.2 var(--f-display); letter-spacing: 0.01em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.bar h1 small { display: block; font: 500 12px/1.3 var(--f-ui); color: var(--muted); letter-spacing: 0; }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; padding-left: 6px; }
.brand-mark { width: 34px; height: 34px; flex: none; border-radius: 9px; object-fit: cover; box-shadow: 0 0 0 1px var(--line); }
.brand h1 { margin: 0; flex: initial; }
.toptabs { display: none; gap: 2px; }
.icon-btn {
  width: 42px; height: 42px; flex: none; display: grid; place-items: center; border: 0; border-radius: 10px;
  background: transparent; color: var(--ink);
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:disabled { opacity: 0.35; cursor: default; }
.icon-btn svg, .btn svg, .nav-btn svg, .menu-item svg { width: 22px; height: 22px; flex: none; }

/* ---------- main ---------- */
main {
  max-width: 1240px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px));
}
body.editor main { padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
.loading { display: grid; place-items: center; min-height: 50vh; color: var(--muted); }

/* ---------- bottom nav ---------- */
.nav {
  /* на 4px ниже края экрана: на больших iPhone остаётся дробный зазор в 1 пиксель */
  position: fixed; left: 0; right: 0; bottom: -4px; z-index: 30;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 4px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.nav-in { height: var(--nav-h); display: grid; grid-template-columns: repeat(5, 1fr); max-width: 620px; margin: 0 auto; }
.nav-btn {
  border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--muted); font-size: 11.5px; font-weight: 500; letter-spacing: 0.01em;
}
.nav-btn .pill { width: 48px; height: 30px; border-radius: 15px; display: grid; place-items: center; transition: background .15s; }
.nav-btn[aria-current="page"] { color: var(--ink); }
.nav-btn[aria-current="page"] .pill { background: var(--accent); color: var(--accent-ink); }
body.editor .nav { display: none; }
/* фон панели продолжается вниз: под ней не просвечивает содержимое (iPhone, жесты, клавиатура) */
.nav::after, .palette::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 120px; background: var(--surface); pointer-events: none; }

@media (min-width: 900px) {
  .nav { display: none; }
  .toptabs { display: flex; }
  main { padding-bottom: 40px; }
  body.editor main { padding-bottom: 140px; }
  .toptab {
    border: 0; background: none; height: 38px; padding: 0 14px; border-radius: 19px; color: var(--muted);
    font-weight: 500; display: flex; align-items: center; gap: 8px;
  }
  .toptab svg { width: 19px; height: 19px; }
  .toptab[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
}

/* ---------- headings, sections ---------- */
.page-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin: 4px 0 14px; }
.page-head h2 { margin: 0; flex: 1; min-width: 0; font: 600 21px/1.2 var(--f-display); text-wrap: balance; }
.page-head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.section { margin: 22px 0 10px; display: flex; align-items: center; gap: 10px; }
.section h3 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); flex: 1; }
.hint { color: var(--muted); font-size: 13.5px; margin: 6px 0; max-width: 65ch; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); border: 1.5px dashed var(--line-strong); border-radius: var(--r); }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 0 16px;
  border-radius: 21px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 500;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(0.97); }
.btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 45%, var(--line)); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.small { min-height: 34px; padding: 0 12px; font-size: 14px; border-radius: 17px; }
.btn.small svg { width: 18px; height: 18px; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn-row.end { justify-content: flex-end; }
.fab {
  position: fixed; z-index: 25; right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px));
  height: 54px; padding: 0 20px 0 16px; border-radius: 27px; border: 0; background: var(--accent); color: var(--accent-ink);
  font-weight: 600; display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow);
}
.fab svg { width: 22px; height: 22px; }
@media (min-width: 900px) { .fab { bottom: 28px; } }

/* ---------- cards ---------- */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 14px 12px;
  display: flex; flex-direction: column; gap: 8px; min-width: 0; cursor: pointer; text-align: left; color: inherit;
}
.card:hover { border-color: var(--line-strong); }
.card-top { display: flex; align-items: flex-start; gap: 10px; }
.card-top > div:not(.month-badge) { flex: 1; min-width: 0; }
.card h4 { margin: 0; font-size: 16.5px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.card .meta { color: var(--muted); font-size: 13px; }
.card .more { margin: -8px -8px 0 0; }
.month-badge {
  width: 46px; flex: none; border-radius: 9px; border: 1px solid var(--line); overflow: hidden; text-align: center; background: var(--surface);
}
.month-badge span { display: block; background: var(--red); color: var(--red-ink); font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; padding: 2px 0; text-transform: uppercase; }
.month-badge b { display: block; font: 600 15px/1.6 var(--f-display); }
.mini-cal { display: grid; grid-template-columns: repeat(31, 1fr); gap: 2px; }
.mini-cal i { height: 6px; border-radius: 1.5px; background: var(--line); }
.mini-cal i.on { background: var(--ink); opacity: 0.55; }
.mini-cal i.red { background: var(--red); opacity: 0.85; }
.mini-cal i.na { background: transparent; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px;
  background: var(--surface-2); border: 1px solid var(--line); font-size: 12.5px; font-weight: 500; color: var(--muted); white-space: nowrap;
}

/* ---------- archive ---------- */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.search {
  flex: 1 1 220px; min-width: 0; height: 42px; border-radius: 21px; border: 1px solid var(--line-strong); background: var(--surface);
  padding: 0 14px 0 40px; background-repeat: no-repeat; background-position: 13px 50%; background-size: 18px;
}
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; margin-bottom: 14px; }
.filter {
  height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid var(--line-strong); background: var(--surface); white-space: nowrap; font-size: 14px;
}
.filter[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.arch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.arch-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; cursor: pointer; display: flex; flex-direction: column; text-align: left; padding: 0; color: inherit; }
.arch-card:hover { border-color: var(--line-strong); }
.thumb { aspect-ratio: 4 / 3; max-width: 100%; background: var(--paper); display: grid; place-items: center; overflow: hidden; border-bottom: 1px solid var(--line); }
.thumb img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
.thumb .ph { color: #8a96a2; display: grid; place-items: center; gap: 4px; font-size: 12px; }
.thumb .ph svg { width: 34px; height: 34px; }
.arch-card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.arch-card h4 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.arch-card .meta { color: var(--muted); font-size: 12.5px; }
.entry-desc { white-space: pre-wrap; max-width: 70ch; margin: 0 0 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.files { display: grid; gap: 14px; }
.file-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.file-card .fhead { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 14px; border-bottom: 1px solid var(--line); }
.file-card .fhead > svg { width: 20px; height: 20px; flex: none; color: var(--muted); }
.chip svg { width: 15px; height: 15px; flex: none; }
.file-card .fhead span { flex: 1; min-width: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-card .fbody { background: var(--paper); cursor: zoom-in; }
.file-card .fbody img, .file-card .fbody canvas { display: block; width: 100%; height: auto; }
.pdf-pages { display: grid; gap: 1px; background: var(--line); }

/* ---------- forms ---------- */
.form { display: grid; gap: 14px; max-width: 760px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 500; color: var(--muted); }
.input, .select, .textarea {
  width: 100%; min-width: 0; height: 42px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface);
  padding: 0 12px;
}
.textarea { height: auto; min-height: 96px; padding: 10px 12px; resize: vertical; line-height: 1.45; }
.select { padding-right: 30px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
@media (max-width: 480px) { .row3 { grid-template-columns: 1fr 1fr; } }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; min-width: 0; }
.box > h4 { margin: 0; font-size: 14px; font-weight: 600; }
.check { display: flex; align-items: center; gap: 10px; font-size: 14.5px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 21px; padding: 3px; background: var(--surface); gap: 2px; max-width: 100%; overflow-x: auto; }
.seg button { border: 0; background: none; height: 34px; padding: 0 14px; border-radius: 17px; font-weight: 500; font-size: 14px; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.line-ed { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; }
.line-ed .ctrls { display: flex; gap: 2px; }
.line-ed .icon-btn { width: 36px; height: 36px; }
@media (max-width: 560px) { .line-ed { grid-template-columns: 1fr; } .line-ed .ctrls { justify-content: flex-start; flex-wrap: wrap; } }
.mini-seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.mini-seg button { border: 0; width: 34px; height: 34px; background: var(--surface); display: grid; place-items: center; color: var(--muted); }
.mini-seg button + button { border-left: 1px solid var(--line); }
.mini-seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.mini-seg svg { width: 18px; height: 18px; }

/* ---------- schedule grid ---------- */
.ed-tabs { margin: 0 0 12px; }
.grid-wrap {
  overflow: auto; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface);
  max-height: calc(100dvh - var(--bar-h) - 230px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  min-height: 260px; overscroll-behavior: contain;
}
table.grid { border-collapse: separate; border-spacing: 0; font-variant-numeric: tabular-nums; user-select: none; -webkit-user-select: none; }
.grid th, .grid td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 0; text-align: center; white-space: nowrap; }
.grid thead th {
  position: sticky; top: 0; z-index: 2; background: var(--surface-2); height: 46px; font-weight: 600; font-size: 13px;
  border-bottom: 1.5px solid var(--line-strong);
}
.grid thead th.day { width: 38px; min-width: 38px; cursor: pointer; line-height: 1.05; }
.grid thead th.day b { display: block; font-size: 14px; }
.grid thead th.day small { display: block; font-size: 10px; font-weight: 500; color: var(--muted); margin-top: 2px; }
.grid thead th.day.red { background: var(--red); color: var(--red-ink); }
.grid thead th.day.red small { color: var(--red-ink); opacity: 0.85; }
.grid thead th.day.na { color: var(--line-strong); }
.grid .sticky1 { position: sticky; left: 0; z-index: 1; background: var(--surface); }
.grid .sticky2 { position: sticky; left: 30px; z-index: 1; background: var(--surface); border-right: 1.5px solid var(--line-strong); }
.grid thead .sticky1, .grid thead .sticky2 { z-index: 3; background: var(--surface-2); }
.grid .num { width: 30px; min-width: 30px; color: var(--muted); font-size: 12.5px; }
.grid .name { min-width: 148px; max-width: 148px; text-align: left; padding: 0 8px; overflow: hidden; text-overflow: ellipsis; cursor: pointer; font-size: 13.5px; }
.grid td.name { font-weight: 500; }
.grid td.name:hover { background: var(--surface-2); }
.grid .tab { min-width: 62px; font-size: 12.5px; padding: 0 6px; }
.grid td.tab { font-family: var(--f-mono); color: var(--muted); cursor: pointer; }
.grid td.c { height: 42px; width: 38px; min-width: 38px; font-size: 14px; font-weight: 600; cursor: pointer; }
.grid td.c:hover { background: var(--surface-2); }
.grid td.c.redcol { background: var(--red-soft); }
.grid td.c.na { background: repeating-linear-gradient(135deg, var(--surface-2) 0 4px, var(--surface) 4px 8px); cursor: default; }
.grid td.c.long { font-size: 11.5px; font-weight: 600; }
.grid td.c.flash { animation: flash .35s ease-out; }
@keyframes flash { from { background: var(--accent-soft); } }
.grid .hrs { min-width: 52px; font-size: 13.5px; padding: 0 4px; }
.grid td.hrs { cursor: pointer; }
.grid td.sum { font-family: var(--f-mono); font-size: 12.5px; color: var(--ok); }
.grid td.sum.off { color: var(--warn); font-weight: 600; }
.grid thead th.sum { color: var(--muted); font-weight: 500; }
.grid-wrap.painting table.grid { touch-action: none; }
.grid-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

/* palette */
.palette {
  position: fixed; left: 0; right: 0; bottom: -4px; z-index: 30; background: var(--surface); border-top: 1px solid var(--line);
  padding: 8px max(10px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  box-shadow: 0 -6px 18px rgb(20 30 40 / 0.06);
}
.palette-in { max-width: 1240px; margin: 0 auto; display: grid; gap: 6px; }
.pal-label { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); min-height: 18px; white-space: nowrap; overflow: hidden; }
.pal-label svg { width: 16px; height: 16px; flex: none; }
.pal-label > span:first-of-type { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pal-label > span:last-child { flex: none; }
.pal-label b { color: var(--ink); font-weight: 600; }
.pal-row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
.brush {
  flex: none; min-width: 48px; height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface);
  font-weight: 700; font-size: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; gap: 3px;
}
.brush small { font-size: 9.5px; font-weight: 500; color: var(--muted); letter-spacing: 0.02em; }
.brush[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.brush[aria-pressed="true"] small { color: var(--accent-ink); opacity: 0.75; }
.brush.tool { font-size: 13px; font-weight: 600; }
.brush.tool svg { width: 20px; height: 20px; }
.pal-sep { width: 1px; flex: none; background: var(--line); margin: 4px 2px; }

/* ---------- list editor ---------- */
.lt-wrap { overflow: auto; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface); max-height: calc(100dvh - var(--bar-h) - 210px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 240px; }
table.lt { border-collapse: separate; border-spacing: 0; width: 100%; }
.lt th { position: sticky; top: 0; z-index: 2; background: var(--surface-2); font-size: 12.5px; font-weight: 600; text-align: left; padding: 10px 8px; border-bottom: 1.5px solid var(--line-strong); border-right: 1px solid var(--line); white-space: nowrap; }
.lt td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0; vertical-align: top; }
.lt td.idx, .lt th.idx { width: 46px; min-width: 46px; position: sticky; left: 0; background: var(--surface); z-index: 1; text-align: center; }
.lt th.idx { z-index: 3; background: var(--surface-2); }
.lt td.idx button { width: 100%; height: 40px; border: 0; background: none; color: var(--muted); font-family: var(--f-mono); font-size: 12.5px; }
.lt td.idx button:hover { background: var(--surface-2); color: var(--ink); }
.lt td.auto { color: var(--muted); font-family: var(--f-mono); font-size: 13px; text-align: center; padding: 10px 6px; }
.lt textarea {
  display: block; width: 100%; min-height: 40px; border: 0; background: transparent; padding: 9px 8px; resize: none; line-height: 1.35; font-size: 14.5px;
  overflow: hidden; field-sizing: content;
}
.lt textarea:focus { background: var(--accent-soft); outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
.lt tr.hit td { background: var(--accent-soft); }

/* ---------- sheets, menus, toast ---------- */
.scrim { position: fixed; inset: 0; z-index: 60; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; animation: fade .15s ease-out; }
.sheet {
  width: 100%; max-width: 620px; max-height: calc(100dvh - 40px - env(safe-area-inset-top, 0px)); overflow: auto; background: var(--surface);
  border-radius: 18px 18px 0 0; padding: 8px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  animation: up .2s cubic-bezier(.2,.8,.2,1);
}
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line-strong); margin: 2px auto 10px; }
.sheet h3 { margin: 4px 0 12px; font: 600 17px/1.3 var(--f-display); text-wrap: balance; }
.sheet p { margin: 0 0 12px; color: var(--muted); }
@media (min-width: 700px) {
  .scrim { align-items: center; }
  .sheet { border-radius: 18px; padding-bottom: 18px; }
  .sheet .grab { display: none; }
}
.menu { display: grid; gap: 2px; margin: 0 -8px; }
.menu-item {
  display: flex; align-items: center; gap: 14px; min-height: 50px; padding: 0 12px; border: 0; border-radius: 10px; background: none; text-align: left; font-size: 15.5px;
}
.menu-item:hover { background: var(--surface-2); }
.menu-item small { display: block; color: var(--muted); font-size: 12.5px; }
.menu-item.danger { color: var(--red); }
.menu-item > span { flex: 1; min-width: 0; }
.menu-sep { height: 1px; background: var(--line); margin: 6px 8px; }
.toast {
  position: fixed; z-index: 80; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 22px + env(safe-area-inset-bottom, 0px));
  max-width: min(92vw, 480px); background: var(--ink); color: var(--surface); padding: 12px 16px; border-radius: 12px; font-size: 14.5px;
  box-shadow: var(--shadow); animation: up .2s ease-out;
}
body.editor .toast { bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translate(var(--tx, 0), 14px); opacity: 0; } }
.toast { --tx: -50%; }

/* ---------- viewer / preview ---------- */
.viewer { position: fixed; inset: 0; z-index: 70; background: #0b0f13; display: flex; flex-direction: column; color: #e8edf1; }
.viewer-bar {
  display: flex; align-items: center; gap: 4px; padding: calc(6px + env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) 6px max(8px, env(safe-area-inset-left, 0px));
  background: #11171d; border-bottom: 1px solid #222c35;
}
.viewer-bar .icon-btn { color: #e8edf1; }
.viewer-bar .icon-btn:hover { background: #1d262f; }
.viewer-bar h3 { flex: 1; min-width: 0; margin: 0 6px; font: 600 14px/1.25 var(--f-ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.viewer-bar .zoom { font-family: var(--f-mono); font-size: 12.5px; min-width: 44px; text-align: center; color: #9fb0bf; }
.viewer-body { flex: 1; overflow: auto; touch-action: pan-x pan-y; overscroll-behavior: contain; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); -webkit-overflow-scrolling: touch; }
.viewer-pages { display: grid; gap: 16px; justify-items: center; margin: 0 auto; }
.viewer-pages img, .viewer-pages canvas { display: block; background: #fff; box-shadow: 0 4px 24px rgb(0 0 0 / 0.5); max-width: none; }
.viewer-foot { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 10px max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); background: #11171d; border-top: 1px solid #222c35; }
.viewer-foot .btn { background: #1b232b; color: #e8edf1; border-color: #34414d; }
.viewer-foot .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

.busy { position: fixed; inset: 0; z-index: 90; background: var(--scrim); display: grid; place-items: center; }
.busy div { background: var(--surface); padding: 18px 22px; border-radius: 14px; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow); }
.spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: rot .8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }

.notice { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); font-size: 14px; margin-bottom: 14px; }
.notice svg { width: 20px; height: 20px; flex: none; margin-top: 1px; color: var(--accent-text); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
ol.steps { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14.5px; max-width: 65ch; }

#printArea { display: none; }
@media print {
  body > *:not(#printArea) { display: none !important; }
  body::before { display: none !important; }
  #printArea { display: block !important; }
  #printArea img { display: block; width: 100%; height: auto; page-break-after: always; break-after: page; }
  #printArea img:last-child { page-break-after: auto; break-after: auto; }
  html, body { background: #fff !important; padding: 0 !important; margin: 0 !important; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- production calendar ---------- */
.cal-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; margin-bottom: 12px; }
@media (max-width: 520px) { .cal-stats b { font-size: 18px; } .cal-stats > div { padding: 10px 12px; } .cal-stats span { font-size: 12px; } }
.cal-stats > div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; }
.cal-stats b { font: 600 22px/1.15 var(--f-display); font-variant-numeric: tabular-nums; }
.cal-stats span { color: var(--muted); font-size: 13px; }
.cal-stats .warn { border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); }
.cal-stats .warn b { color: var(--warn); font-size: 17px; }
.cal-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin: 4px 0 14px; }
.cal-legend span { display: inline-flex; align-items: center; gap: 7px; }
.cal-legend i { width: 16px; height: 16px; border-radius: 5px; display: inline-block; }
.cal-legend i.off { background: var(--cal-off); } .cal-legend i.holiday { background: var(--cal-hol); } .cal-legend i.short { background: var(--cal-short); }
.cal-legend i.today { box-shadow: inset 0 0 0 2px var(--ink); }
.cal-months { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 520px) { .cal-months { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 760px) { .cal-months { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 1020px) { .cal-months { grid-template-columns: repeat(4, 1fr); } }
.cal-month { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px 12px; min-width: 0; }
.cal-mhead { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.cal-mhead h4 { margin: 0; flex: 1; font: 600 14px/1.2 var(--f-display); }
.cal-mhead .meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cal-mhead .icon-btn { width: 32px; height: 32px; margin-right: -6px; }
.cal-mhead .icon-btn svg { width: 18px; height: 18px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.cal-grid .wd { font-size: 10.5px; color: var(--muted); padding-bottom: 3px; font-weight: 500; }
.cal-grid .d { height: 27px; display: grid; place-items: center; border-radius: 6px; }
.cal-grid .d.off { background: var(--cal-off); color: var(--cal-off-ink); }
.cal-grid .d.holiday { background: var(--cal-hol); color: var(--cal-hol-ink); font-weight: 700; }
.cal-grid .d.short { background: var(--cal-short); color: var(--cal-short-ink); font-weight: 600; }
.cal-grid .d.ww { text-decoration: underline; text-underline-offset: 2px; }
.cal-grid .d.today { box-shadow: inset 0 0 0 2px var(--ink); }
.norms-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
table.norms { border-collapse: collapse; width: 100%; min-width: 520px; font-variant-numeric: tabular-nums; font-size: 14px; }
.norms th, .norms td { padding: 8px 12px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.norms th { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface-2); }
.norms th:first-child, .norms td:first-child { text-align: left; }
.norms tr.sum td { font-weight: 600; background: var(--surface-2); }
.norms tr.year td { font-weight: 700; background: var(--accent-soft); border-bottom: 0; }
.cal-notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.cal-notes ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: 14px; }
.grid thead th.day.short::after { content: ""; display: block; height: 3px; margin: 3px 8px 0; border-radius: 2px; background: var(--cal-short-ink); opacity: 0.65; }
.toast { display: flex; align-items: center; gap: 14px; width: max-content; }
.toast > span { flex: 1 1 auto; min-width: 0; }
.toast-act { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; border-radius: 8px; padding: 6px 12px; flex: none; }
.cell-select { display: block; width: 100%; min-height: 40px; border: 0; background: transparent; padding: 0 8px; font-size: 14.5px; color: var(--ink); appearance: auto; }
.cell-select:focus { background: var(--accent-soft); outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
.lt tfoot td { position: sticky; bottom: 0; background: var(--surface-2); border-top: 1.5px solid var(--line-strong); font-weight: 600; font-size: 14px; padding: 10px 8px; text-align: center; white-space: nowrap; z-index: 1; }
.lt tfoot td.tot-label { text-align: right; }
.lt tfoot td.idx { position: sticky; left: 0; z-index: 2; }
.mini-seg.sz button { width: auto; padding: 0 8px; font-size: 12px; font-weight: 500; }
.tot-bar { margin: -2px 0 10px; }
.tot-bar:empty { display: none; }
.chip.strong { color: var(--ink); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, transparent); font-weight: 600; height: 30px; font-size: 13.5px; }
/* ---------- login ---------- */
body.locked .nav, body.locked .toptabs, body.locked .fab { display: none !important; }
.login-card { max-width: 400px; margin: 4vh auto 0; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px 20px 18px; display: grid; gap: 14px; box-shadow: var(--shadow); }
.login-card h2 { margin: 0; font: 600 22px/1.2 var(--f-display); text-align: center; }
.login-card .hint { text-align: center; margin: -4px 0 4px; justify-self: center; }
.login-logo { width: 88px; height: 88px; border-radius: 22px; justify-self: center; object-fit: cover; box-shadow: 0 0 0 1px var(--line), var(--shadow); }
.pass-wrap { position: relative; }
.pass-wrap .input { padding-right: 48px; }
.pass-wrap .icon-btn { position: absolute; right: 2px; top: 0; height: 42px; width: 44px; color: var(--muted); }
.login-err { margin: -4px 0 0; min-height: 1.2em; color: var(--red); font-size: 14px; font-weight: 500; }
.login-err:empty { min-height: 0; margin: 0; }
.login-card .btn.primary { min-height: 48px; font-size: 16px; }
/* sync status */
.sync-btn { position: relative; color: var(--muted); }
.sync-btn::after { content: ""; position: absolute; right: 8px; bottom: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 2px var(--surface); }
.sync-btn[data-state="pending"]::after { background: var(--warn); }
.sync-btn[data-state="busy"]::after { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
.sync-btn[data-state="offline"]::after { background: var(--line-strong); }
.sync-btn[data-state="error"]::after { background: var(--red); }
@keyframes pulse { 50% { opacity: 0.35; } }

function openViewer(title, buildPages, footBtns) {
  let zoom = 1;
  const pagesEl = h('div', { class: 'viewer-pages' });
  const zLabel = h('span', { class: 'zoom' }, '100%');
  const body = h('div', { class: 'viewer-body' }, pagesEl);
  const applyZoom = () => {
    const avail = Math.max(200, body.clientWidth - 32);
    $$('img,canvas', pagesEl).forEach(el => { const base = +el.dataset.w || avail; el.style.width = Math.round(Math.min(base, avail) * zoom) + 'px'; });
    zLabel.textContent = Math.round(zoom * 100) + '%';
  };
  const v = h('div', { class: 'viewer', role: 'dialog', 'aria-label': title },
    h('div', { class: 'viewer-bar' },
      h('button', { class: 'icon-btn', 'aria-label': 'Закрыть', onclick: () => o.close() }, icon('x')),
      h('h3', null, title),
      h('button', { class: 'icon-btn', 'aria-label': 'Уменьшить', onclick: () => setZoom(zoom / 1.4, body.clientWidth / 2, body.clientHeight / 2) }, icon('zoomout')), zLabel,
      h('button', { class: 'icon-btn', 'aria-label': 'Увеличить', onclick: () => setZoom(zoom * 1.4, body.clientWidth / 2, body.clientHeight / 2) }, icon('zoomin'))),
    body, footBtns && footBtns.length ? h('div', { class: 'viewer-foot' }, footBtns) : null);
  // масштаб жестами — только здесь (во всём остальном приложении зум выключен)
  const setZoom = (z, mx, my) => {
    z = Math.min(5, Math.max(0.5, z)); if (Math.abs(z - zoom) < 0.002) return;
    const r = z / zoom, ax = body.scrollLeft + mx, ay = body.scrollTop + my;
    zoom = z; applyZoom();
    body.scrollLeft = ax * r - mx; body.scrollTop = ay * r - my;
    sharpenSoon();
  };
  const local = (x, y) => { const rc = body.getBoundingClientRect(); return [x - rc.left, y - rc.top]; };
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  let pinch = null, tap = null, lastTap = null;
  body.addEventListener('touchstart', e => {
    if (e.touches.length === 2) { pinch = { d: dist(e.touches), z: zoom }; tap = null; lastTap = null; }
    else if (e.touches.length === 1 && !pinch) tap = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
  }, { passive: true });
  body.addEventListener('touchmove', e => {
    if (pinch && e.touches.length === 2) {
      e.preventDefault();
      const [mx, my] = local((e.touches[0].clientX + e.touches[1].clientX) / 2, (e.touches[0].clientY + e.touches[1].clientY) / 2);
      setZoom(pinch.z * dist(e.touches) / pinch.d, mx, my);
    } else if (tap && e.touches.length === 1 && Math.hypot(e.touches[0].clientX - tap.x, e.touches[0].clientY - tap.y) > 10) tap = null;
  }, { passive: false });
  body.addEventListener('touchend', e => {
    if (pinch) { if (!e.touches.length) pinch = null; return; }
    if (!tap || e.touches.length || Date.now() - tap.t > 300) { tap = null; return; }
    if (lastTap && Date.now() - lastTap.t < 320 && Math.hypot(tap.x - lastTap.x, tap.y - lastTap.y) < 30) {
      e.preventDefault(); const [mx, my] = local(tap.x, tap.y); setZoom(zoom > 1.25 ? 1 : 2.5, mx, my); lastTap = null;
    } else lastTap = tap;
    tap = null;
  }, { passive: false });
  body.addEventListener('dblclick', e => { const [mx, my] = local(e.clientX, e.clientY); setZoom(zoom > 1.25 ? 1 : 2.5, mx, my); });
  body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); const [mx, my] = local(e.clientX, e.clientY); setZoom(zoom * Math.exp(-e.deltaY / 220), mx, my); }, { passive: false });

  let sharpT = 0;
  const sharpenSoon = () => { clearTimeout(sharpT); sharpT = setTimeout(sharpen, 350); };
  const sharpen = () => {
    const dpr = window.devicePixelRatio || 1;
    $$('canvas', pagesEl).forEach(el => {
      const p = el._page; if (!p) return;
      const need = parseFloat(el.style.width) * dpr, inch = p.w / 25.4;
      const cap = Math.min(maxDpi(p, 300), Math.floor(Math.sqrt(8e6 / (inch * (p.h / 25.4)))));
      if (need <= el.width * 1.15 || el._dpi >= cap) return;
      const dpi = Math.min(cap, Math.ceil(need / inch));
      const cv = renderPageToCanvas(p, dpi); cv._page = p; cv._dpi = dpi; cv.dataset.w = el.dataset.w; cv.style.width = el.style.width;
      el.replaceWith(cv);
    });
  };
  const o = overlay(v);
  (async () => {
    pagesEl.append(h('div', { class: 'spin' }));
    try { const els = await buildPages(); pagesEl.replaceChildren(...els); applyZoom(); }
    catch (e) { console.error(e); pagesEl.replaceChildren(h('p', null, 'Не удалось показать: ' + e.message)); }
  })();
  window.addEventListener('resize', applyZoom);
  const oc = o.close; o.close = () => { window.removeEventListener('resize', applyZoom); oc(); };
  return o;
}

  }, [btn('PNG', 'image', 'png'), btn('PDF', 'pdf', 'pdf', true), btn(Platform.canPrint() ? 'Печать' : 'PDF для печати', 'print', 'print')]);

let encCache = null;
async function fetchEnc() {
  if (encCache) return encCache;

  const magic = new TextDecoder().decode(buf.slice(0, 4));
  if (magic !== 'ZHKS' || buf[4] !== 1) throw new Error('BADFILE');
  const iter = new DataView(buf.buffer, buf.byteOffset + 5, 4).getUint32(0);
  encCache = { iter, salt: buf.slice(9, 25), iv: buf.slice(25, 37), ct: buf.slice(37) };
  return encCache;
}

}

  form.addEventListener('submit', async e => {
    e.preventDefault(); err.textContent = '';
    const t = tab.value.replace(/\D/g, '');
    if (!t) { err.textContent = 'Введите табельный номер.'; tab.focus(); return; }
    if (!normPass(pass.value)) { err.textContent = 'Введите пароль.'; pass.focus(); return; }
    btn.disabled = true; btn.textContent = 'Проверяю…';
    if (Sync.url()) {
      try {
        await Sync.login(Sync.url(), t, pass.value, txt => { btn.textContent = txt; }, async () => {
          if (!window.crypto || !crypto.subtle) return;
          const { data, raw } = await decryptWithPassword(pass.value);
          await applyBackupData(data, false);
          await Store.setMeta('dk', await blobToB64(new Blob([raw])));
        });
        await Store.setMeta('seedVer', SEED_VER);
        document.body.classList.remove('locked'); go('schedules', null, { root: true }); toast('Здравствуйте, ' + Sync.cfg.name);
      } catch (ex) { console.warn(ex); err.textContent = syncMsg(ex.message); }
      finally { btn.disabled = false; btn.textContent = 'Войти'; }
      return;
    }
    if (!window.crypto || !crypto.subtle) { err.textContent = 'Вход работает только по защищённому адресу https://.'; btn.disabled = false; btn.textContent = 'Войти'; return; }
    try {
      const { data, raw } = await decryptWithPassword(pass.value);
      const who = (data.staff || []).find(p => String(p.tab) === t);
      if (!who) { err.textContent = 'Сотрудник с табельным номером ' + t + ' не найден.'; return; }
      btn.textContent = 'Загружаю данные…';
      await applyBackupData(data, false);
      await Store.setMeta('dk', await blobToB64(new Blob([raw])));
      await Store.setMeta('auth', { name: who.name, tab: who.tab, at: Date.now() });
      document.body.classList.remove('locked');
      go('schedules', null, { root: true });
      toast('Здравствуйте, ' + who.name);
    } catch (ex) {
      console.warn(ex);
      err.textContent = ex.message === 'BADPASS' ? 'Неверный пароль.' : ex.message === 'NONET' ? 'Нет связи с сайтом. Проверьте интернет и повторите.' : 'Не удалось открыть данные: ' + ex.message;
    } finally { btn.disabled = false; btn.textContent = 'Войти'; }
  });
  main.append(form);
  setTimeout(() => tab.focus(), 120);
}
async function logout() {
  if (!(await confirmBox('Выйти и удалить данные?', 'Графики, списки и архив будут удалены с этого телефона. Если вы что-то меняли, сначала сохраните резервную копию.', 'Выйти и удалить'))) return;
  await withBusy('Удаляю данные…', async () => {
    try { await new Promise(res => { const r = indexedDB.deleteDatabase('zhurnal-hks'); r.onsuccess = r.onerror = r.onblocked = () => res(); setTimeout(res, 1500); }); } catch (e) { /* ignore */ }
    location.reload();
  });
}

/* ============================== boot ============================== */
/** Версия с сайта: проверка при запуске и при возвращении в приложение (iPhone не перезагружает свёрнутое приложение). */
let webUpdLast = 0, webUpdShown = 0;
async function autoWebUpdate() {
  if (Platform.viewer || Platform.android || !/^https?:$/.test(location.protocol) || !navigator.onLine) return;
  if (Date.now() - webUpdLast < 5 * 60e3) return; webUpdLast = Date.now();
  try {
    const r = await fetch('version.json', { cache: 'no-store' }); if (!r.ok) return;
    const v = await r.json(); if (!v || !(v.build > APP_BUILD) || webUpdShown === v.build) return;
    webUpdShown = v.build;
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration().catch(() => null);
    if (reg) reg.update().catch(() => {});
    toast('Доступна новая версия ' + v.version, 20000, { label: 'Обновить', fn: () => location.reload() });
  } catch (e) { /* нет связи — проверим позже */ }
}
/** Страница не масштабируется щипком и двойным касанием (кроме просмотрщика, где масштаб свой). */
function lockPageZoom() {
  const stop = e => e.preventDefault();
  for (const t of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(t, stop, { passive: false });
  document.addEventListener('wheel', e => { if (e.ctrlKey && !(e.target.closest && e.target.closest('.viewer-body'))) e.preventDefault(); }, { passive: false });
  if (Platform.ios) document.documentElement.classList.add('ios');
}
async function boot() {
  lockPageZoom();
  try { const t = localStorage.getItem('theme'); if (t && t !== 'auto' && !Platform.viewer) document.documentElement.setAttribute('data-theme', t); } catch (e) { /* ignore */ }
  buildShell(); setBar();
  if (Platform.viewer) {
    const use = n => Promise.race([window.claude.use(n).catch(() => null), sleep(11000).then(() => null)]);
    const [db, user, assets, downloads] = await Promise.all([use('db'), use('user'), use('assets'), use('downloads')]);
    Platform.downloads = downloads;
    if (db && user) {
      try { const id = await user.id(); if (id) await Store.initCloud(db, assets, id); }
      catch (e) { console.warn('cloud init failed', e); }
    }
  }
  if (Store.mode === 'memory') await Store.initLocal();
  await loadConfig();
  if (!Platform.viewer) Sync.load();
  await seedIfNeeded();
  syncThemeColor();
  if (await needLogin()) showLogin(); else go('schedules', null, { root: true });
  Docs.ensure().catch(e => console.warn(e));
  if (useHistory) { try { history.replaceState({ d: 0 }, ''); } catch (e) { /* ignore */ } }
  setTimeout(autoWebUpdate, 4000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') autoWebUpdate(); });
  if ('serviceWorker' in navigator && !Platform.viewer && !Platform.android && location.protocol === 'https:') {
    const hadCtrl = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadCtrl) toast('Приложение обновлено', 9000, { label: 'Перезагрузить', fn: () => location.reload() }); });
  }
  window.matchMedia && matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncThemeColor);
}
boot();

</script>
